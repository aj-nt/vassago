name: Feature Request
about: Suggest a new feature or enhancement for Vassago
title: "Feature: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Thank you for suggesting a feature! Please fill out the form below to help us understand your request."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear and concise description of the problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false