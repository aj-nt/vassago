name: Bug Report
about: Report a bug in Vassago
title: "Bug: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug! Please fill out the form below to help us address the issue."
  - type: input
    id: vassago-version
    attributes:
      label: Vassago Version
      placeholder: e.g., 2.9
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., Windows 10, macOS 12, Ubuntu 20.04
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: If applicable, provide your Vassago configuration or relevant settings.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the bug here.
    validations:
      required: false