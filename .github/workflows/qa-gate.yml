name: QA Gate

on:
  pull_request:
    branches: [main]

jobs:
  qa-pass:
    name: QA Pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # All tests must pass with race detector
      - name: Run tests with race detector
        run: go test -race -timeout 120s -count=1 ./...

      # Static analysis
      - name: Run go vet
        run: go vet ./...

      - name: Check build
        run: go build ./...

      # Verify proto is up to date
      - name: Verify proto generation
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative -I proto proto/mnemosyne.proto
          git diff --exit-code proto/

      # Lint
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64.8
          args: --timeout=5m