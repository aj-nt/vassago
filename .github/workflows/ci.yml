name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Shared gate: license headers ──
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers
        run: ./scripts/check-license-headers.sh

  # ── Tests: race + vet + build, ubuntu + macos ──
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: license-headers
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -timeout 120s -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check build
        run: go build ./...

  # ── Lint ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: "goinstall"
          args: --timeout=5m

  # ── Security scan ──
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  # ── Coverage with threshold gate ──
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          THRESHOLD=30
          if [ -z "$TOTAL" ]; then
            echo "ERROR: Could not parse coverage percentage"
            exit 1
          fi
          echo "Total coverage: ${TOTAL}%"
          echo "Threshold: ${THRESHOLD}%"
          if awk "BEGIN {exit !($TOTAL < $THRESHOLD)}"; then
            echo "FAIL: Coverage ${TOTAL}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${TOTAL}% meets the ${THRESHOLD}% threshold"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Python SDK tests ──
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        run: cd sdk/python && pip install -e ".[dev]"

      - name: Run Python tests
        run: cd sdk/python && python -m pytest tests/ -v
