name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOPRIVATE: github.com/aj-nt/*
  GONOSUMCHECK: github.com/aj-nt/*
  GONOSUMDB: github.com/aj-nt/*

jobs:
  # ── Shared gate: license headers ──
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers
        run: ./scripts/check-license-headers.sh

  # ── Tests: race + vet + build, ubuntu + macos ──
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: license-headers
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: vassago

      - name: Check out vassago-sdk (private dependency)
        uses: actions/checkout@v4
        with:
          repository: aj-nt/vassago-sdk
          path: vassago-sdk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: vassago/go.mod

      - name: Replace remote dependency with local
        run: cd vassago && go mod edit -replace github.com/aj-nt/vassago-sdk=../vassago-sdk && go mod tidy

      - name: Run tests with race detector
        run: cd vassago && go test -race -timeout 120s -count=1 ./...

      - name: Run go vet
        run: cd vassago && go vet ./...

      - name: Check build
        run: cd vassago && go build ./...

  # ── Lint ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vassago

      - name: Check out vassago-sdk (private dependency)
        uses: actions/checkout@v4
        with:
          repository: aj-nt/vassago-sdk
          path: vassago-sdk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: vassago/go.mod

      - name: Replace remote dependency with local
        run: cd vassago && go mod edit -replace github.com/aj-nt/vassago-sdk=../vassago-sdk && go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: "goinstall"
          args: --timeout=5m
          working-directory: vassago

  # ── Security scan ──
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vassago

      - name: Check out vassago-sdk (private dependency)
        uses: actions/checkout@v4
        with:
          repository: aj-nt/vassago-sdk
          path: vassago-sdk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: vassago/go.mod

      - name: Replace remote dependency with local
        run: cd vassago && go mod edit -replace github.com/aj-nt/vassago-sdk=../vassago-sdk && go mod tidy

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: vassago/go.mod
          work-dir: vassago

  # ── Coverage with threshold gate ──
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vassago

      - name: Check out vassago-sdk (private dependency)
        uses: actions/checkout@v4
        with:
          repository: aj-nt/vassago-sdk
          path: vassago-sdk

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: vassago/go.mod

      - name: Replace remote dependency with local
        run: cd vassago && go mod edit -replace github.com/aj-nt/vassago-sdk=../vassago-sdk && go mod tidy

      - name: Run coverage
        run: cd vassago && go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        run: |
          TOTAL=$(go tool cover -func=vassago/coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          THRESHOLD=30
          if [ -z "$TOTAL" ]; then
            echo "ERROR: Could not parse coverage percentage"
            exit 1
          fi
          echo "Total coverage: ${TOTAL}%"
          echo "Threshold: ${THRESHOLD}%"
          if awk "BEGIN {exit !($TOTAL < $THRESHOLD)}"; then
            echo "FAIL: Coverage ${TOTAL}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${TOTAL}% meets the ${THRESHOLD}% threshold"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: vassago/coverage.out

  # ── Python SDK tests ──
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vassago

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        run: cd vassago/sdk/python && pip install -e ".[dev]"

      - name: Run Python tests
        run: cd vassago/sdk/python && python -m pytest tests/ -v
