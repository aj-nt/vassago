name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits are pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Shared gate: license headers ──
  license-headers:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers
        run: ./scripts/check-license-headers.sh

  # ── Tests: race + vet + build (linux only, macOS dropped for billing — 10x multiplier)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: license-headers
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -timeout 120s -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check build
        run: go build ./...

  # ── Lint ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: "binary"
          args: --timeout=5m

  # ── Security scan ──
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  # ── Coverage with threshold gate ──
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          THRESHOLD=30
          if [ -z "$TOTAL" ]; then
            echo "ERROR: Could not parse coverage percentage"
            exit 1
          fi
          echo "Total coverage: ${TOTAL}%"
          echo "Threshold: ${THRESHOLD}%"
          if awk "BEGIN {exit !($TOTAL < $THRESHOLD)}"; then
            echo "FAIL: Coverage ${TOTAL}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${TOTAL}% meets the ${THRESHOLD}% threshold"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Python SDK tests ──
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vassago-sdk (for proto files)
        uses: actions/checkout@v4
        with:
          repository: aj-nt/vassago-sdk
          path: vassago-sdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        run: cd sdk/python && pip install -e ".[dev]"

      - name: Compile proto stubs
        run: |
          mkdir -p sdk/python/src/vassago/_proto
          python -m grpc_tools.protoc \
            -I vassago-sdk/proto \
            --python_out=sdk/python/src/vassago/_proto \
            --grpc_python_out=sdk/python/src/vassago/_proto \
            vassago-sdk/proto/vassago.proto \
            vassago-sdk/proto/messaging.proto
          sed -i.bak 's/^import vassago_pb2 as /from . import vassago_pb2 as /' sdk/python/src/vassago/_proto/vassago_pb2_grpc.py
          sed -i.bak 's/^import messaging_pb2 as /from . import messaging_pb2 as /' sdk/python/src/vassago/_proto/messaging_pb2_grpc.py

      - name: Run Python tests
        run: cd sdk/python && python -m pytest tests/ -v --ignore=tests/test_integration.py
