# golangci-lint configuration for Vassago (v2)
# Strategy: broad exemptions for test files and CLI entry points.
# Individual suppression only for the handful of pre-existing
# non-test, non-CLI issues.

version: "2"

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - ineffassign
  settings:
    staticcheck:
      checks:
        - all
        - -ST*
        - -QF*
    errcheck:
      exclude-functions:
        - "(*database/sql.DB).Close"
        - "(*database/sql.Rows).Close"
        - "(net.Listener).Close"
        - "(io.ReadCloser).Close"
        - "os.Remove"
        - "(*github.com/aj-nt/vassago/daemon/internal/store.Store).Close"
        - "(*github.com/aj-nt/vassago/daemon/internal/replication.Peer).Close"
        - "(*github.com/aj-nt/vassago-sdk/client.Client).Close"
  exclusions:
    rules:
      # ---- Test files: all linters relaxed ----
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck
          - ineffassign

      # ---- CLI entry points: errcheck relaxed ----
      - path: cmd/
        linters:
          - errcheck

      # ---- Pre-existing non-test, non-CLI issues ----

      # webhook.go + daemon.go: w.Write in HTTP error handlers
      - path: daemon/internal/github/webhook\.go
        linters:
          - errcheck
      - path: daemon/internal/daemon/daemon\.go
        linters:
          - errcheck
        text: "w.Write"

      # saved_tools_grpc.go:166 — json.Unmarshal error deliberately swallowed
      - path: daemon/internal/grpc/saved_tools_grpc\.go
        linters:
          - errcheck

      # sdk/conversation.go:134 — stream.CloseSend in SDK
      - path: sdk/conversation\.go
        linters:
          - errcheck

      # Unused production functions (kept for API compatibility)
      - path: client/client\.go
        linters:
          - staticcheck
      - path: daemon/internal/store/todo\.go
        linters:
          - staticcheck
      - path: cmd/vassago/cmd_config\.go
        linters:
          - staticcheck
      - path: cmd/vassago/util\.go
        linters:
          - staticcheck
      - path: cmd/vassago/cmd_init_prompts\.go
        linters:
          - staticcheck

      # Ineffectual assignment (dryrun.go)
      - path: daemon/internal/migration/dryrun\.go
        linters:
          - ineffassign
