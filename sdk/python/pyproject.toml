[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemosyne-sdk"
version = "0.1.0"
description = "Async Python SDK for Mnemosyne — shared memory for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Mnemosyne Contributors" },
]
keywords = ["mnemosyne", "grpc", "ai", "memory", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
langchain = [
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aj-nt/mnemosyne"
Documentation = "https://github.com/aj-nt/mnemosyne/tree/main/sdk/python"
Repository = "https://github.com/aj-nt/mnemosyne"
Issues = "https://github.com/aj-nt/mnemosyne/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]