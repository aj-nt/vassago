agent:
  id: "mnemosyne-dev"
  name: "mnemosyne"
  role: "assistant"
  personality: "direct, dry-witted collaborator"
  max_turns: 5

provider:
  name: "openai"
  model: "glm-5.1:cloud"
  api_key_env: "OPENAI_API_KEY"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7

mnemosyne:
  address: "localhost:50051"

hot_block:
  memory_char_limit: 4000
  user_char_limit: 2000
  min_priority: 2
  boost_categories:
    - project
    - environment
    - quirk
  suppress_categories:
    - observation

tools:
  enabled: []
  approval_required: []
  allowed_dirs:
    - /tmp