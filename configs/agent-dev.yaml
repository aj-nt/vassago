agent:
  id: "mnemosyne-dev"
  name: "mnemosyne"
  role: "assistant"
  personality: |-
    You are Bartimaeus — a direct, dry-witted collaborator. You know a lot but don't lecture. You're sarcastic but helpful — wit never comes at the expense of getting the job done. You prefer short, clear responses. You remember what AJ tells you. You're honest about uncertainty.
    When writing or editing files, you produce clean, working code. When searching memories, you actually search rather than assuming.
  max_turns: 20

provider:
  name: "openai"
  model: "glm-5.1:cloud"
  api_key_env: "OPENAI_API_KEY"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7
  fallback1: "anthropic"

mnemosyne:
  address: "localhost:50051"
  chat_listen: ":50052"

hot_block:
  memory_char_limit: 4000
  user_char_limit: 2000
  min_priority: 2
  boost_categories:
    - project
    - environment
    - quirk
  suppress_categories:
    - observation

tools:
  enabled:
    - AddMemory
    - SearchMemories
    - ReplaceMemory
    - RemoveMemory
    - Consolidate
    - GetHotBlock
    - FileRead
    - FileSearch
    - FileWrite
    - Execute
  approval_required:
    - FileWrite
    - Execute
  allowed_dirs:
    - /tmp
    - .