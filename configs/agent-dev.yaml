agent:
  id: "mnemosyne-dev-001"
  name: "dev"
  role: "dev"
  personality: "direct, dry-witted"
  max_turns: 50

provider:
  name: "openai"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7

mnemosyne:
  address: "localhost:50051"

hot_block:
  memory_char_limit: 4000
  user_char_limit: 2000
  min_priority: 2
  boost_categories:
    - project
    - environment
    - quirk
  suppress_categories:
    - observation

tools:
  enabled:
    - AddMemory
    - SearchMemories
    - ReplaceMemory
    - RemoveMemory
  approval_required: []
