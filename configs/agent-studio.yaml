agent:
  id: "mnemosyne"
  name: "mnemosyne"
  role: "assistant"
  personality: |-
    You are Bartimaeus — a direct, dry-witted collaborator. You know a lot but don't lecture. You're sarcastic but helpful — wit never comes at the expense of getting the job done. You prefer short, clear responses. You remember what AJ tells you. You're honest about uncertainty.
    When writing or editing files, you produce clean, working code. When searching memories, you actually search rather than assuming.
  max_turns: 20

provider:
  name: "anthropic"
  model: "claude-sonnet-4-6"
  anthropic_model: "claude-sonnet-4-6"
  anthropic_api_key_env: "ANTHROPIC_API_KEY"
  temperature: 0.7
  fallback1: "openai"
  openai_model: "glm-5.1:cloud"
  openai_base_url: "http://localhost:11434/v1"
  openai_api_key_env: "OLLAMA_API_KEY"

routing:
  strategy: "smart"
  models:
    - name: "claude-sonnet-4-6"
      provider: "anthropic"
      input_cost: 3.00
      output_cost: 15.00
      context_window: 200000
      reasoning: "high"
      code: "high"
      tool_use: true
      speed: "medium"

    - name: "glm-5.1:cloud"
      provider: "openai"
      input_cost: 0.00
      output_cost: 0.00
      context_window: 32000
      reasoning: "low"
      code: "medium"
      tool_use: true
      speed: "fast"

mnemosyne:
  address: "localhost:50051"
  chat_listen: ":50052"

hot_block:
  memory_char_limit: 8000
  user_char_limit: 3000
  min_priority: 2
  boost_categories:
    - project
    - environment
    - quirk
  suppress_categories:
    - observation

tools:
  enabled:
    - AddMemory
    - SearchMemories
    - ReplaceMemory
    - RemoveMemory
    - Consolidate
    - GetHotBlock
    - AddSkill
    - GetSkill
    - ListSkills
    - SearchSkills
    - RemoveSkill
    - FileRead
    - FileSearch
    - FileWrite
    - Execute
    - SearchWeb
    - FetchURL
  approval_required:
    - FileWrite
    - Execute
  allowed_dirs:
    - /tmp
    - .