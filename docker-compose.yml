# Vassago Docker Compose
#
# Usage:
#   docker compose up -d          # start daemon
#   docker compose logs -f daemon  # view daemon logs
#   docker compose down            # stop

services:
  daemon:
    build: .
    container_name: vassago-daemon
    ports:
      - "50051:50051"
    volumes:
      - vassago-data:/data
      - ./config:/etc/vassago:ro
    environment:
      - VASSAGO_CONFIG_PATH=/etc/vassago/daemon.yaml
    healthcheck:
      test: ["CMD", "vassago", "health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  vassago-data:
